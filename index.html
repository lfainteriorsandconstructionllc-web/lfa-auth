<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso LFA Cloud</title>
  <style>
    :root { --bg:#0B1222; --card:#121C31; --gold:#B89858; --gold-lt:#E5CA87; --txt:#F8FAFC; --muted:#94A3B8; --ok:#22C55E; --err:#EF4444; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:18px; }
    .card { width:100%; max-width:440px; background:var(--card); border:1.5px solid rgba(216,190,130,0.45); border-radius:18px; padding:24px 20px; text-align:center; box-shadow:0 18px 40px rgba(0,0,0,0.5); }
    h1 { margin:0 0 6px; font-size:19px; color:var(--gold-lt); letter-spacing:0.3px; }
    p { margin:0 0 16px; font-size:13.5px; color:var(--muted); line-height:1.5; }
    .btn { display:block; width:100%; padding:13px 16px; border-radius:12px; border:1px solid var(--gold-lt); background:linear-gradient(180deg,#EBDEB3 0%,#D4B87A 38%,#B89858 75%,#896E46 100%); color:#0F172A; font-weight:800; font-size:14px; text-decoration:none; cursor:pointer; margin-bottom:14px; }
    .box { text-align:left; background:#0F172A; border:1px solid rgba(184,152,88,0.3); border-radius:12px; padding:14px; margin-top:10px; }
    label { display:block; font-size:11.5px; font-weight:700; color:var(--gold-lt); margin-bottom:6px; }
    input { width:100%; padding:10px 12px; border-radius:9px; border:1px solid rgba(184,152,88,0.4); background:#16223B; color:#fff; font-size:14px; margin-bottom:10px; }
    .btn-sec { width:100%; padding:10px; border-radius:9px; border:1.2px solid var(--gold); background:transparent; color:var(--gold-lt); font-weight:700; font-size:13px; cursor:pointer; }
    .msg { font-size:12.5px; font-weight:600; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="brand-title">☁️ LFA Cloud</h1>
    <p id="status-txt">Conectando de forma segura con tu cuenta...</p>
    <a id="open-app-btn" class="btn" style="display:none;" href="#">Abrir Aplicación y Entrar</a>
    <button class="btn-sec" id="copy-desktop-btn" type="button" style="display:none; margin-bottom:10px;">📋 Copiar Sesión para Mac / Windows</button>
    <div id="pwd-box" class="box" style="display:none;">
      <label>Asignar o Cambiar tu Contraseña de Acceso (mín. 6 caracteres)</label>
      <input type="password" id="new-pwd" placeholder="Escribe tu nueva contraseña..." minlength="6" />
      <button class="btn-sec" id="save-pwd-btn" type="button">Guardar Contraseña Definitiva</button>
      <div id="pwd-msg" class="msg"></div>
    </div>
  </div>
  <script>
    (function() {
      const SB_URL = "https://ucdnresfmewdxfjhtdjh.supabase.co";
      const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjZG5yZXNmbWV3ZHhmamh0ZGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzNzcwMzYsImV4cCI6MjExMDk1MzAzNn0.C877zPHANhry7V5WrGu_fUTAyYu5mz8AEqf8lwxZ1ps";
      const searchParams = new URLSearchParams(window.location.search);

      // 1-Tap Google OAuth launcher preserving target LFA app across Supabase redirect
      if (searchParams.get("start") === "google") {
        const reqApp = searchParams.get("app") || "realestate";
        try { localStorage.setItem("lfa_pending_app", reqApp); } catch (_) {}
        document.cookie = "lfa_pending_app=" + encodeURIComponent(reqApp) + "; path=/; max-age=600; SameSite=Lax";
        const redir = encodeURIComponent("https://lfainteriorsandconstructionllc-web.github.io/lfa-auth/");
        window.location.replace(SB_URL + "/auth/v1/authorize?provider=google&redirect_to=" + redir + "&prompt=select_account");
        return;
      }

      function readCookieApp() {
        const m = document.cookie.match(/(?:^|;\s*)lfa_pending_app=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : "";
      }

      let storedApp = "";
      try {
        storedApp = localStorage.getItem("lfa_pending_app") || "";
        localStorage.removeItem("lfa_pending_app");
      } catch (_) {}
      if (!storedApp) storedApp = readCookieApp();
      document.cookie = "lfa_pending_app=; path=/; max-age=0";

      const targetApp = searchParams.get("app") || storedApp || "realestate";
      const isStudio = (targetApp === "studio");

      const titleEl = document.getElementById("brand-title");
      const statusEl = document.getElementById("status-txt");
      const openBtn = document.getElementById("open-app-btn");
      const pwdBox = document.getElementById("pwd-box");

      titleEl.textContent = isStudio ? "☁️ LFA Studio Academy Cloud" : "☁️ LFA Real Estate Pro Cloud";
      openBtn.textContent = isStudio ? "Abrir LFA Studio Academy y Entrar" : "Abrir LFA Real Estate Pro y Entrar";

      const raw = window.location.hash ? window.location.hash.substring(1) : window.location.search.substring(1);
      const params = new URLSearchParams(raw);
      const token = params.get("access_token");
      const errDesc = params.get("error_description");

      if (token) {
        const deepLink = (isStudio ? "lfastudio://auth-callback#" : "lfarealestate://login-callback#") + raw;
        const copyBtn = document.getElementById("copy-desktop-btn");
        openBtn.href = deepLink;
        openBtn.style.display = "block";
        copyBtn.style.display = "block";
        pwdBox.style.display = "block";
        statusEl.textContent = "¡Sesión verificada! Entrando automáticamente a tu aplicación LFA...";
        setTimeout(function() { window.location.href = deepLink; }, 250);

        copyBtn.onclick = function() {
          navigator.clipboard.writeText(deepLink).then(function() {
            copyBtn.textContent = "✓ Sesión copiada — Pégala en la app de Escritorio";
          });
        };

        document.getElementById("save-pwd-btn").onclick = async function() {
          const pw = document.getElementById("new-pwd").value;
          const m = document.getElementById("pwd-msg");
          if (!pw || pw.length < 6) { m.style.color = "#EF4444"; m.textContent = "Ingresa al menos 6 caracteres."; return; }
          m.style.color = "#E5CA87"; m.textContent = "Guardando contraseña...";
          try {
            const res = await fetch(SB_URL + "/auth/v1/user", {
              method: "PUT",
              headers: { "apikey": SB_KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
              body: JSON.stringify({ password: pw })
            });
            if (res.ok) {
              m.style.color = "#22C55E";
              m.textContent = "✓ Contraseña guardada con éxito. Ya puedes entrar siempre con tu correo y clave.";
            } else {
              const j = await res.json().catch(() => ({}));
              m.style.color = "#EF4444";
              m.textContent = j.msg || j.message || "No se pudo actualizar.";
            }
          } catch (e) {
            m.style.color = "#EF4444"; m.textContent = "Error de red: " + e;
          }
        };
      } else if (errDesc) {
        statusEl.textContent = "La sesión expiró (" + errDesc + "). Vuelve a intentarlo desde la app.";
      } else {
        statusEl.textContent = "Portal seguro de autenticación LFA Cloud activo.";
      }
    })();
  </script>
</body>
</html>
